<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1a19">
<title>調香ページ | nehne</title>
<style>
:root{--g:#00A496;--gl:#1d3b38;--gold:#C9A227;--bg:#0d1a19;--card:#162624;--ink:#eaf5f3;--sub:#7f9a97;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);overscroll-behavior:none;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
 display:flex;flex-direction:column;
 padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}

#bar.top{padding-bottom:2px;border-bottom:1px solid #1c302e}
#bar.top .chip{font-size:13px;padding:8px 14px}
#bar{flex:0 0 auto;display:flex;gap:5px;padding:8px 8px 6px;overflow-x:auto;scrollbar-width:none;align-items:center}
#bar::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);color:var(--sub);border:1px solid #24403d;border-radius:999px;
 padding:7px 12px;font-size:12.5px;font-weight:700;font-family:inherit}
.chip.on{background:var(--g);color:#03211f;border-color:var(--g)}
.sep{flex:0 0 auto;width:1px;height:20px;background:#24403d;margin:0 3px}

#grid{flex:1 1 auto;overflow-y:auto;display:grid;gap:5px;padding:0 8px 6px;align-content:start}
#grid.c2{grid-template-columns:1fr 1fr}
#grid.c1{grid-template-columns:1fr}
.it{background:var(--card);border:1px solid #24403d;border-left:4px solid var(--g);border-radius:9px;
 padding:8px 9px;display:flex;align-items:center;gap:8px;min-height:52px;transition:opacity .12s}
.it .amt{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
 line-height:1;min-width:52px;text-align:right}
.it .amt small{font-size:9.5px;font-weight:700;color:var(--sub);margin-left:1px}
.it .nm{font-size:12.5px;font-weight:600;line-height:1.25;flex:1;overflow:hidden}
.it .nm b{display:block;font-size:9.5px;color:var(--sub);font-weight:700;letter-spacing:.06em}
.it.next{border-color:var(--gold);border-left-color:var(--gold);background:#2a2415;box-shadow:0 0 0 1px var(--gold)}
.it.done{opacity:.22;border-left-color:#3a5c58}
.it.done .amt{text-decoration:line-through}

#foot{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:7px 9px 9px;
 background:#0a1413;border-top:1px solid #24403d}
#prog{flex:1 1 auto}
#prog .n{font-size:12px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between}
#prog .b{height:5px;background:#1e3532;border-radius:99px;margin-top:5px;overflow:hidden}
#prog .b i{display:block;height:100%;width:0;background:var(--g);transition:width .15s}
#next{flex:0 0 auto;background:var(--g);color:#03211f;border:none;border-radius:11px;
 padding:13px 18px;font-size:14.5px;font-weight:800;font-family:inherit}
#next.hot{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.18)}}
#undo{flex:0 0 auto;background:none;border:1px solid #24403d;color:var(--sub);border-radius:11px;
 padding:13px 12px;font-size:13px;font-weight:700;font-family:inherit}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:var(--gold);color:#1a1405;
 font-weight:800;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body>

<div id="bar" class="top">
  <button class="chip on" data-s="0">紅茶とイチジク</button>
  <button class="chip" data-s="1">ピーチとチュベローズ</button>
  <button class="chip" data-s="2">アニスとバニラ</button>
  <button class="chip" data-s="3">スパイスと乳香</button>
</div>

<div id="bar">
  <button class="chip on" data-f="0">スケルトン</button>
  <button class="chip" data-f="1">ベース</button>
  <button class="chip" data-f="2">フル</button>
  <span class="sep"></span>
  <button class="chip" data-v="50">50µL</button>
  <button class="chip on" data-v="100">100µL</button>
  <button class="chip" data-v="500">500µL</button>
  <span class="sep"></span>
  <button class="chip on" id="cols">2列</button>
  <button class="chip on" id="auto">連続</button>
  <button class="chip" id="wake">画面ON</button>
</div>

<div id="grid" class="c2"></div>

<div id="foot">
  <button id="undo">戻す</button>
  <div id="prog"><div class="n"><span id="cnt">0 / 0</span><span id="tubes">0本</span></div><div class="b"><i></i></div></div>
  <button id="next">次のチューブ</button>
</div>
<div id="toast"></div>

 ]}

];
let F = SC[0].F;

let si=0, fi=0, total=100, done=[], tubes=0, auto=true, order=[], lock=null;
const grid=document.getElementById("grid");

function amt(v){const t=F[fi].items.reduce((s,x)=>s+x.v,0);const a=total*v/t;
  return a>=100?a.toFixed(0):(a<10?a.toFixed(2):a.toFixed(1));}

function build(){
  done=new Array(F[fi].items.length).fill(false); order=[];
  grid.innerHTML=F[fi].items.map(function(it,i){
    return '<div class="it" data-i="'+i+'"><span class="amt">'+amt(it.v)+'<small>µL</small></span>'
      +'<span class="nm"><b>'+it.p+'</b>'+it.n+'</span></div>';
  }).join("");
  paint();
}
function paint(){
  const n=done.filter(Boolean).length, t=done.length;
  const nextI=done.indexOf(false);
  [...grid.children].forEach(function(el,i){
    el.className="it"+(done[i]?" done":"")+(i===nextI?" next":"");
  });
  document.getElementById("cnt").textContent=n+" / "+t;
  document.getElementById("tubes").textContent=tubes+"本";
  document.querySelector("#prog i").style.width=(n/t*100)+"%";
  const nx=document.getElementById("next");
  nx.className=(n===t)?"hot":"";
  if(n===t&&auto)setTimeout(function(){if(done.every(Boolean))nextTube();},500);
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.className="on";
  setTimeout(()=>t.className="",900);}
function nextTube(){tubes++;done.fill(false);order=[];paint();toast(tubes+"本目 完了");
  if(navigator.vibrate)navigator.vibrate(30);grid.scrollTop=0;}

grid.addEventListener("click",function(e){
  const el=e.target.closest(".it"); if(!el)return;
  const i=+el.dataset.i;
  if(done[i]){done[i]=false;order=order.filter(x=>x!==i);}
  else{done[i]=true;order.push(i);if(navigator.vibrate)navigator.vibrate(8);}
  paint();
});
document.getElementById("undo").onclick=function(){
  const i=order.pop(); if(i===undefined)return; done[i]=false; paint();
};
document.getElementById("next").onclick=nextTube;

document.querySelectorAll("[data-s]").forEach(b=>b.onclick=function(){
  document.querySelectorAll("[data-s]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); si=+b.dataset.s; F=SC[si].F; fi=0;
  document.querySelectorAll("[data-f]").forEach((x,i)=>x.classList.toggle("on",i===0));
  build();
});
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=function(){
  document.querySelectorAll("[data-f]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); fi=+b.dataset.f; build();
});
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=function(){
  document.querySelectorAll("[data-v]").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); total=+b.dataset.v; build();
});
document.getElementById("cols").onclick=function(){
  const two=grid.classList.toggle("c2"); grid.classList.toggle("c1",!two);
  this.classList.toggle("on",two); this.textContent=two?"2列":"1列";
};
document.getElementById("auto").onclick=function(){
  auto=!auto; this.classList.toggle("on",auto);
};
document.getElementById("wake").onclick=async function(){
  try{
    if(lock){lock.release();lock=null;this.classList.remove("on");return;}
    lock=await navigator.wakeLock.request("screen");
    lock.addEventListener("release",()=>{lock=null;document.getElementById("wake").classList.remove("on");});
    this.classList.add("on");
  }catch(e){toast("この端末では使えません");}
};
build();

</body>
</html>
